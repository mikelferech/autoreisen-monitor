name: Binter - diagnóstico puntual de portada
on:
  push:
    paths:
      - '.github/workflows/binter-home-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 8
    defaults:
      run:
        working-directory: monitoring
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: monitoring/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node binter-home-diagnostic.mjs
