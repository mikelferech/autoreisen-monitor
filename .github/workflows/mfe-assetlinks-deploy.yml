name: Publicar vínculo Android MFE

on:
  push:
    paths:
      - ".github/workflows/mfe-assetlinks-deploy.yml"

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      RELEASE_ZIP: mobile-release/MFE_Viajes_RELEASE.zip
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar release actual
        shell: bash
        run: |
          set -euo pipefail
          test -f "$RELEASE_ZIP"
          RELEASE_DIR="$RUNNER_TEMP/mfe-release"
          rm -rf "$RELEASE_DIR"
          mkdir -p "$RELEASE_DIR"
          unzip -q "$RELEASE_ZIP" -d "$RELEASE_DIR"
          test -f "$RELEASE_DIR/firebase.json"
          test -f "$RELEASE_DIR/public/app.js"
          grep -q 'const APP_VERSION = "2.4.31"' "$RELEASE_DIR/public/app.js" || {
            echo "::error::El ZIP móvil no es MFE Viajes v2.4.31; no se publica nada."
            exit 1
          }
          echo "RELEASE_DIR=$RELEASE_DIR" >> "$GITHUB_ENV"

      - name: Añadir Digital Asset Links
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RELEASE_DIR/public/.well-known"
          cat > "$RELEASE_DIR/public/.well-known/assetlinks.json" <<'EOF'
          [{
            "relation": ["delegate_permission/common.handle_all_urls"],
            "target": {
              "namespace": "android_app",
              "package_name": "com.mikelferech.mfeviajes",
              "sha256_cert_fingerprints": [
                "05:E5:7D:A6:FE:85:37:B5:C4:37:7F:9F:D3:FE:9D:33:C7:E0:AE:9C:34:D5:35:38:55:FD:29:53:2F:72:3A:76"
              ]
            }
          }]
          EOF

      - name: Autenticar Google / Firebase
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_MFE_VIAJES || secrets.FIREBASE_SERVICE_ACCOUNT_PRESUPUESTO_HOGAR_9DEAD }}

      - name: Publicar Hosting
        shell: bash
        run: |
          set -euo pipefail
          cd "$RELEASE_DIR"
          npx --yes firebase-tools@latest deploy --only hosting:viajes --project presupuesto-hogar-9dead --non-interactive
