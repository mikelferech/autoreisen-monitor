name: Hotel Dunas Club · Fuerteventura · etapa 2
on:
  schedule:
    - cron: '50 6 * * *'
      timezone: 'Europe/Madrid'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar consulta'
        type: boolean
        default: true
        required: false
permissions:
  contents: read
concurrency:
  group: dunas-stage2
  cancel-in-progress: false
jobs:
  monitor:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitoring
    env:
      MFE_WORKER_URL: ${{ secrets.MFE_WORKER_URL }}
      MFE_MONITOR_SECRET: ${{ secrets.MFE_MONITOR_SECRET }}
      MFE_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: monitoring/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node dunas-run.mjs
      - name: Guardar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: dunas-monitor-diagnostico
          path: monitoring/artifacts/
          if-no-files-found: ignore
          retention-days: 7
