name: AutoReisen · MFE Viajes

on:
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      force:
        description: 'Forzar comprobación aunque todavía no toque'
        required: false
        default: true
        type: boolean
      telegram_test:
        description: 'Enviar solo un mensaje de prueba por Telegram'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: autoreisen-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: monitoring
    env:
      MFE_WORKER_URL: ${{ secrets.MFE_WORKER_URL }}
      MFE_MONITOR_SECRET: ${{ secrets.MFE_MONITOR_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN || secrets.TELEGRAM_TOKEN || secrets.BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID || secrets.TELEGRAM_CHAT || secrets.CHAT_ID }}
      MFE_FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.force || false }}
      MFE_TEST_TELEGRAM: ${{ github.event_name == 'workflow_dispatch' && inputs.telegram_test || false }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: monitoring/package-lock.json
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: node monitor.mjs
      - name: Guardar diagnóstico si falla
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: autoreisen-diagnostico
          path: monitoring/artifacts/
          if-no-files-found: ignore
          retention-days: 7
