name: Compilar MFE Viajes APK

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/mfe-apk-build.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Preparar Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar SDK necesario
        shell: bash
        run: |
          set -euo pipefail
          yes | /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null || true
          /usr/local/lib/android/sdk/cmdline-tools/latest/bin/sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.13"

      - name: Descargar icono actual
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mfe-apk"
          mkdir -p "$ROOT/app/src/main/res/mipmap-xxxhdpi"
          curl -fsSL "https://mfe-viajes-2026.web.app/icons/install-icon-512.png" -o "$ROOT/app/src/main/res/mipmap-xxxhdpi/ic_launcher.png"

      - name: Generar proyecto Android TWA
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/mfe-apk"
          mkdir -p "$ROOT/app/src/main/res/values"
          mkdir -p "$ROOT/app/src/main/res/xml"
          mkdir -p "$ROOT/app/src/main"

          cat > "$ROOT/settings.gradle" <<'EOF'
          pluginManagement {
              repositories {
                  google()
                  mavenCentral()
                  gradlePluginPortal()
              }
          }
          dependencyResolutionManagement {
              repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
              repositories {
                  google()
                  mavenCentral()
              }
          }
          rootProject.name = "MFEViajes"
          include(":app")
          EOF

          cat > "$ROOT/build.gradle" <<'EOF'
          plugins {
              id "com.android.application" version "8.13.0" apply false
          }
          EOF

          cat > "$ROOT/gradle.properties" <<'EOF'
          android.useAndroidX=true
          android.enableJetifier=true
          android.suppressUnsupportedCompileSdk=36
          EOF

          cat > "$ROOT/app/build.gradle" <<'EOF'
          plugins {
              id "com.android.application"
          }

          android {
              namespace "com.mikelferech.mfeviajes"
              compileSdk 36

              defaultConfig {
                  applicationId "com.mikelferech.mfeviajes"
                  minSdk 24
                  targetSdk 36
                  versionCode 2
                  versionName "2.4.31-gc27"
              }

              buildTypes {
                  release {
                      minifyEnabled false
                  }
              }

              compileOptions {
                  sourceCompatibility JavaVersion.VERSION_1_8
                  targetCompatibility JavaVersion.VERSION_1_8
              }
          }

          dependencies {
              implementation "com.google.androidbrowserhelper:androidbrowserhelper:2.7.4"
          }
          EOF

          cat > "$ROOT/app/src/main/res/values/strings.xml" <<'EOF'
          <resources>
              <string name="app_name">GC 27</string>
              <string name="asset_statements" translatable="false">[{"relation":["delegate_permission/common.handle_all_urls"],"target":{"namespace":"web","site":"https://mfe-viajes-2026.web.app/"}}]</string>
              <string name="provider_authority">com.mikelferech.mfeviajes.fileprovider</string>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/res/values/colors.xml" <<'EOF'
          <resources>
              <color name="mfe_background">#111318</color>
              <color name="mfe_background_dark">#111318</color>
          </resources>
          EOF

          cat > "$ROOT/app/src/main/res/xml/filepaths.xml" <<'EOF'
          <paths>
              <files-path path="twa_splash/" name="twa_splash" />
          </paths>
          EOF

          cat > "$ROOT/app/src/main/AndroidManifest.xml" <<'EOF'
          <?xml version="1.0" encoding="utf-8"?>
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"
              xmlns:tools="http://schemas.android.com/tools">

              <uses-permission android:name="android.permission.INTERNET" />

              <queries>
                  <intent>
                      <action android:name="android.support.customtabs.action.CustomTabsService" />
                  </intent>
              </queries>

              <application
                  android:allowBackup="true"
                  android:icon="@mipmap/ic_launcher"
                  android:label="@string/app_name"
                  android:supportsRtl="true"
                  android:manageSpaceActivity="com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity"
                  android:theme="@android:style/Theme.Translucent.NoTitleBar"
                  android:usesCleartextTraffic="false">

                  <meta-data
                      android:name="asset_statements"
                      android:resource="@string/asset_statements" />

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.ManageDataLauncherActivity"
                      android:exported="false">
                      <meta-data
                          android:name="android.support.customtabs.trusted.MANAGE_SPACE_URL"
                          android:value="https://mfe-viajes-2026.web.app/" />
                  </activity>

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.LauncherActivity"
                      android:exported="true"
                      android:label="@string/app_name"
                      android:launchMode="singleTop">
                      <meta-data
                          android:name="android.support.customtabs.trusted.DEFAULT_URL"
                          android:value="https://mfe-viajes-2026.web.app/" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR"
                          android:resource="@color/mfe_background" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.STATUS_BAR_COLOR_DARK"
                          android:resource="@color/mfe_background_dark" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR"
                          android:resource="@color/mfe_background" />
                      <meta-data
                          android:name="android.support.customtabs.trusted.NAVIGATION_BAR_COLOR_DARK"
                          android:resource="@color/mfe_background_dark" />

                      <intent-filter>
                          <action android:name="android.intent.action.MAIN" />
                          <category android:name="android.intent.category.LAUNCHER" />
                      </intent-filter>

                      <intent-filter android:autoVerify="true">
                          <action android:name="android.intent.action.VIEW" />
                          <category android:name="android.intent.category.DEFAULT" />
                          <category android:name="android.intent.category.BROWSABLE" />
                          <data
                              android:scheme="https"
                              android:host="mfe-viajes-2026.web.app" />
                      </intent-filter>
                  </activity>

                  <activity
                      android:name="com.google.androidbrowserhelper.trusted.FocusActivity"
                      android:exported="false" />

                  <provider
                      android:name="androidx.core.content.FileProvider"
                      android:authorities="@string/provider_authority"
                      android:grantUriPermissions="true"
                      android:exported="false">
                      <meta-data
                          android:name="android.support.FILE_PROVIDER_PATHS"
                          android:resource="@xml/filepaths" />
                  </provider>

                  <service
                      android:name="com.google.androidbrowserhelper.trusted.DelegationService"
                      android:exported="true"
                      tools:ignore="ExportedService">
                      <intent-filter>
                          <action android:name="android.support.customtabs.trusted.TRUSTED_WEB_ACTIVITY_SERVICE" />
                          <category android:name="android.intent.category.DEFAULT" />
                      </intent-filter>
                  </service>
              </application>
          </manifest>
          EOF

          echo "ANDROID_ROOT=$ROOT" >> "$GITHUB_ENV"

      - name: Compilar APK release sin firmar
        shell: bash
        run: |
          set -euo pipefail
          cd "$ANDROID_ROOT"
          gradle :app:assembleRelease --stacktrace
          test -f app/build/outputs/apk/release/app-release-unsigned.apk
          cp app/build/outputs/apk/release/app-release-unsigned.apk "$RUNNER_TEMP/MFE_Viajes_GC27_unsigned.apk"

      - name: Comprobar APK
        shell: bash
        run: |
          set -euo pipefail
          AAPT=/usr/local/lib/android/sdk/build-tools/36.0.0/aapt
          "$AAPT" dump badging "$RUNNER_TEMP/MFE_Viajes_GC27_unsigned.apk" | head -30
          "$AAPT" dump badging "$RUNNER_TEMP/MFE_Viajes_GC27_unsigned.apk" | grep -q "package: name='com.mikelferech.mfeviajes'"
          "$AAPT" dump badging "$RUNNER_TEMP/MFE_Viajes_GC27_unsigned.apk" | grep -q "application-label:'GC 27'"

      - name: Subir APK
        uses: actions/upload-artifact@v4
        with:
          name: mfe-viajes-gc27-apk-unsigned
          path: ${{ runner.temp }}/MFE_Viajes_GC27_unsigned.apk
          if-no-files-found: error
          retention-days: 7
