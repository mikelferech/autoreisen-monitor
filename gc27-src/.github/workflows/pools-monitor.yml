name: Piscinas · MFE Viajes

on:
  schedule:
    - cron: '10 8,12,16,20 * * *'
      timezone: "Atlantic/Canary"
  workflow_dispatch:
    inputs:
      force:
        description: "Forzar comprobación"
        required: false
        default: "true"

permissions:
  contents: read

concurrency:
  group: mfe-pools-monitor
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: monitoring
    env:
      MFE_WORKER_URL: ${{ secrets.MFE_WORKER_URL }}
      MFE_MONITOR_SECRET: ${{ secrets.MFE_MONITOR_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: monitoring/package-lock.json
      - name: Instalar dependencias Node
        run: npm ci
      - name: Comprobar Chrome preinstalado
        shell: bash
        run: |
          set -e
          if command -v google-chrome >/dev/null 2>&1; then
            google-chrome --version
          elif command -v google-chrome-stable >/dev/null 2>&1; then
            google-chrome-stable --version
          else
            echo "::error::El runner no tiene Google Chrome preinstalado."
            exit 1
          fi
      - name: Leer piscinas de Galileus
        run: node pools.mjs
      - name: Guardar diagnóstico siempre
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: piscinas-diagnostico-${{ github.run_number }}
          path: monitoring/artifacts/pools/
          if-no-files-found: ignore
          retention-days: 7
